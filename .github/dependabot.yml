# Actions first: an unpinned or abandoned action is the most direct route into
# a pipeline that can execute code in the repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # uv.lock is the source of truth. Dependabot edits requirements.txt only for
  # the packages it bumps; CI's requirements job catches anything it misses.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # pydantic pins pydantic-core exactly, so they must move in one PR.
      # Listed first: a dependency joins the first group that matches.
      pydantic:
        patterns: [pydantic, pydantic-core]
      python-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
