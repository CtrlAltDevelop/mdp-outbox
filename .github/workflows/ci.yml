# Runs the tests on a pull request into main — and on nothing else.
# The job lives once in CtrlAltDevelop/ci-workflows (python-test.yml).

name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Test
    uses: CtrlAltDevelop/ci-workflows/.github/workflows/python-test.yml@v1.2.0
    permissions:
      contents: read
    with:
      python-version: "3.14"
      postgres: true
      postgres-image: timescale/timescaledb:latest-pg16
      redis: true
