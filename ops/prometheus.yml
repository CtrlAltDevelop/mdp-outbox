global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: ingest
    static_configs: [{ targets: ["ingest:9100"] }]
  - job_name: aggregate
    static_configs: [{ targets: ["aggregate:9100"] }]
  - job_name: api
    metrics_path: /metrics/
    static_configs: [{ targets: ["api:8000"] }]
  # Only up under `docker compose --profile repair up`; down otherwise.
  - job_name: repair
    static_configs: [{ targets: ["repair:9100"] }]
