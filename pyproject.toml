[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "market-data-pipeline"
version = "0.1.0"
description = "Ingest trades from several sources, build OHLCV candles live and historically, and serve them over REST and WebSocket."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Zarif" }]
requires-python = ">=3.12"
keywords = ["market-data", "ohlcv", "candles", "stream-processing", "redis-streams", "timescaledb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "prometheus-client>=0.21",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "uvicorn>=0.30",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/mdp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "PERF", "N", "PL", "PIE", "RET", "ASYNC"]
ignore = [
    "PLR0913", # constructors take their collaborators explicitly
    "PLR2004", # tests compare against literal fixture values
]

[tool.ruff.lint.isort]
known-first-party = ["mdp"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
exclude = ['^\.venv/', '^build/']
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "timescale: needs a reachable TimescaleDB at DATABASE_URL",
]
